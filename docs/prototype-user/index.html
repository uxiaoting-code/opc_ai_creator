<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 电商创作 · 移动端预览</title>
<link rel="stylesheet" href="css/style.css?v=20260917a" />
</head>
<body>
<div class="stage">
  <!-- 侧边信息面板 -->
  <aside class="side-panel">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div>
        <div class="brand-title">AI 电商创作</div>
        <div class="brand-sub">Kotlin / Jetpack Compose</div>
      </div>
    </div>
    <div class="side-hint">
      Apple × Dribbble 质感 · 毛玻璃 · 鼠尾草绿<br/>
      点击手机内元素可交互，右侧列表可直接跳屏。
    </div>
    <div class="screen-list" id="screenList"></div>
    <div class="tokens">
      <div class="tokens-title">设计令牌</div>
      <div class="token-row"><span class="dot" style="background:#F7F7F5;border:1px solid #e5e5df"></span>暖白底 #F7F7F5</div>
      <div class="token-row"><span class="dot" style="background:#7C9A7E"></span>鼠尾草绿 #7C9A7E</div>
      <div class="token-row"><span class="dot" style="background:#C9A96E"></span>香槟金 #C9A96E</div>
      <div class="token-row"><span class="dot" style="background:#8B8178"></span>灰褐 #8B8178</div>
      <div class="token-row"><span class="dot" style="background:#1C1C1E"></span>柔炭黑 #1C1C1E</div>
    </div>
    <div class="side-actions">
      <a class="ghost-btn" href="../AI聚合平台-Android/" target="_blank">📁 打开 Kotlin 工程</a>
    </div>
  </aside>

  <!-- 手机外壳 -->
  <div class="phone-wrap">
    <div class="phone" id="phone">
      <!-- 背景渐变层（桃 → 奶油） -->
      <div class="phone-bg"></div>
      <div class="phone-notch"></div>
      <div class="phone-status">
        <span>9:41</span>
        <span class="status-right">
          <svg width="14" height="10" viewBox="0 0 14 10"><path d="M1 8h2v2H1zM4 6h2v4H4zM7 4h2v6H7zM10 1h2v9h-2z" fill="currentColor"/></svg>
          <svg width="14" height="10" viewBox="0 0 14 10"><path d="M7 8.5a1 1 0 100-2 1 1 0 000 2zM3.5 5.5a5 5 0 017 0M1 3a8.5 8.5 0 0112 0" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
          <svg width="22" height="10" viewBox="0 0 22 10"><rect x="0.5" y="0.5" width="18" height="9" rx="2" stroke="currentColor" fill="none"/><rect x="2" y="2" width="14" height="6" rx="1" fill="currentColor"/><rect x="19.5" y="3.5" width="1.5" height="3" rx="0.5" fill="currentColor"/></svg>
        </span>
      </div>
      <div class="phone-body" id="phoneBody"></div>
      <nav class="tabbar" id="tabbar">
        <button class="tab active" data-tab="courseCenter"><span class="tab-ico">▤</span><span>课程</span><i class="tab-dot"></i></button>
        <button class="tab" data-tab="home"><span class="tab-ico">✦</span><span>创作</span></button>
        <button class="tab" data-tab="taskMarket"><span class="tab-ico">◎</span><span>接单</span></button>
        <button class="tab" data-tab="me"><span class="tab-ico">◐</span><span>我的</span></button>
      </nav>
      <div class="phone-home"></div>
    </div>
    <div class="phone-caption">iPhone 尺寸 · 390 × 844 · Light Premium</div>
  </div>
</div>

<script src="js/app.js?v=20260917a"></script>
</body>
</html>
